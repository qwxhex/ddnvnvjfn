name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git ccache libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk aidl
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install "cython<3.0.0" "setuptools<70.0.0" buildozer

      - name: Build with Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          # 1. Принудительно выставляем стабильные версии
          sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
          sed -i 's/# android.minapi = 21/android.minapi = 24/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec

          # 2. Очищаем старый кэш с Python 3.14, если он успел создаться
          buildozer distclean || true

          # 3. Запускаем сборку с явным указанием виртуального окружения Python 3.11
          export PATH="$PYTHON:$PATH"
          buildozer --allow-root -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
