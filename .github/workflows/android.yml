name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git ccache libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk aidl
          pip install --upgrade pip
          pip install "cython<3.0.0" "setuptools<70.0.0" buildozer

      - name: Build with Buildozer
        run: |
          # 1. Создаем buildozer.spec, если его нет
          if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
            sed -i 's/# android.minapi = 21/android.minapi = 24/' buildozer.spec
            sed -i 's/# android.ndk = 25b/android.ndk = 25b/' buildozer.spec
            sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
          fi

          # 2. Подготавливаем структуру SDK и привязываем aidl
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/build-tools/33.0.2"
          ln -sf $(which aidl) "$SDK_DIR/build-tools/33.0.2/aidl"

          # 3. Первый короткий запуск Buildozer для загрузки Command Line Tools
          buildozer --allow-root android debug || true

          # 4. Исправляем путь к sdkmanager (создаем симлинк из cmdline-tools в tools)
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            mkdir -p "$SDK_DIR/tools"
            ln -sf "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/tools/bin"
          fi

          # 5. Основная полная сборка
          buildozer --allow-root -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
