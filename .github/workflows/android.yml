name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git ccache libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk aidl
          pip install --upgrade pip
          pip install "cython<3.0.0" "setuptools<70.0.0" buildozer

      - name: Build with Buildozer
        run: |
          # 1. Если buildozer.spec нет — создаем его
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          # 2. Правим конфиг под стабильные версии SDK/NDK
          sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
          sed -i 's/# android.minapi = 21/android.minapi = 24/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
          
          # Явно фиксируем NDK 25b, так как r28c ломает старые структуры путей sdkmanager
          sed -i 's/# android.ndk = .*/android.ndk = 25b/' buildozer.spec
          sed -i 's/android.ndk = .*/android.ndk = 25b/' buildozer.spec

          # 3. Запускаем сборку
          buildozer --allow-root -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
