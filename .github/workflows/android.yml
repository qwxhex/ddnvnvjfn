name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies & AIDL
        run: |
          sudo apt update
          sudo apt install -y build-essential git ccache libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk aidl
          
          # Пробрасываем aidl в системный PATH
          sudo ln -sf /usr/bin/aidl /usr/local/bin/aidl || true

          python3 -m pip install --upgrade pip
          # Ставим официальную стабильную версию 1.6.0
          python3 -m pip install "cython<3.0.0" "setuptools<70.0.0" "buildozer==1.6.0"

      - name: Build with Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          # Очищаем кэш от прошлых неудачных попыток
          buildozer distclean || true

          # Запуск сборки
          buildozer --allow-root -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
